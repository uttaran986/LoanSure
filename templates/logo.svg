<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6FE8"/>
      <stop offset="100%" stop-color="#2DD4FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- Top shine highlight -->
  <rect width="200" height="100" rx="44" fill="url(#shine)"/>

  <!-- Grid icon: top-left block -->
  <rect x="36" y="36" width="52" height="52" rx="10" fill="white" opacity="0.95"/>

  <!-- Grid icon: top-right block (dimmer) -->
  <rect x="112" y="36" width="52" height="52" rx="10" fill="white" opacity="0.45"/>

  <!-- Bottom horizontal lines (representing data/report) -->
  <rect x="36" y="112" width="128" height="11" rx="5.5" fill="white" opacity="0.85"/>
  <rect x="36" y="133" width="80" height="11" rx="5.5" fill="white" opacity="0.55"/>
  <rect x="36" y="154" width="104" height="11" rx="5.5" fill="white" opacity="0.35"/>

  <!-- Subtle border -->
  <rect width="200" height="200" rx="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>
